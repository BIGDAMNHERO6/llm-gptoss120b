<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>My AI</title>

	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #111111;
			color: #f5f5f5;
			height: 100vh;
			overflow: hidden;
		}

		.app {
			display: flex;
			height: 100vh;
		}

		.sidebar {
			width: 280px;
			background: #181818;
			border-right: 1px solid #2a2a2a;
			display: flex;
			flex-direction: column;
			padding: 14px;
		}

		.new-chat {
			width: 100%;
			background: #f5f5f5;
			color: #111;
			border: none;
			border-radius: 10px;
			padding: 12px;
			font-size: 14px;
			cursor: pointer;
			margin-bottom: 16px;
		}

		.new-chat:hover {
			background: #dddddd;
		}

		.conversations {
			flex: 1;
			overflow-y: auto;
		}

		.conversation-item {
			padding: 11px 12px;
			border-radius: 8px;
			margin-bottom: 4px;
			font-size: 14px;
			cursor: pointer;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			color: #cccccc;
		}

		.conversation-item:hover {
			background: #252525;
		}

		.conversation-item.active {
			background: #303030;
			color: white;
		}

		.main {
			flex: 1;
			display: flex;
			flex-direction: column;
			min-width: 0;
		}

		.topbar {
			height: 60px;
			border-bottom: 1px solid #242424;
			display: flex;
			align-items: center;
			padding: 0 22px;
			font-weight: 600;
		}

		.chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: 30px 20px;
		}

		.message {
			max-width: 760px;
			margin: 0 auto 22px auto;
			line-height: 1.55;
			font-size: 15px;
		}

		.message p {
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}

		.user-message {
			background: #2a2a2a;
			padding: 12px 16px;
			border-radius: 14px;
			width: fit-content;
			max-width: min(760px, 85%);
			margin-left: auto;
			margin-right: max(calc((100% - 760px) / 2), 0px);
		}

		.assistant-message {
			color: #eeeeee;
		}

		.typing-indicator {
			display: none;
			max-width: 760px;
			margin: 0 auto;
			padding-bottom: 12px;
			color: #888;
			font-size: 14px;
		}

		.typing-indicator.visible {
			display: block;
		}

		.input-area {
			padding: 16px 20px 24px;
		}

		.input-box {
			max-width: 760px;
			margin: 0 auto;
			background: #202020;
			border: 1px solid #333;
			border-radius: 16px;
			display: flex;
			align-items: flex-end;
			padding: 10px;
		}

		#user-input {
			flex: 1;
			background: transparent;
			border: none;
			outline: none;
			color: white;
			resize: none;
			font: inherit;
			min-height: 24px;
			max-height: 180px;
			padding: 6px 8px;
		}

		#user-input::placeholder {
			color: #777;
		}

		#send-button {
			border: none;
			background: #f5f5f5;
			color: #111;
			border-radius: 9px;
			padding: 8px 14px;
			cursor: pointer;
		}

		#send-button:disabled {
			opacity: 0.4;
			cursor: default;
		}

		.mobile-sidebar-button {
			display: none;
		}

		@media (max-width: 700px) {
			.sidebar {
				position: fixed;
				left: -280px;
				top: 0;
				bottom: 0;
				z-index: 20;
				transition: left 0.2s ease;
			}

			.sidebar.open {
				left: 0;
			}

			.mobile-sidebar-button {
				display: block;
				background: none;
				border: none;
				color: white;
				font-size: 22px;
				margin-right: 14px;
				cursor: pointer;
			}

			.user-message {
				margin-right: 0;
			}
		}
	</style>
</head>

<body>
	<div class="app">

		<aside class="sidebar" id="sidebar">
			<button class="new-chat" id="new-chat-button">
				+ New Chat
			</button>

			<div class="conversations" id="conversation-list"></div>
		</aside>

		<main class="main">

			<div class="topbar">
				<button
					class="mobile-sidebar-button"
					id="mobile-sidebar-button"
				>
					☰
				</button>

				<span id="chat-title">New Chat</span>
			</div>

			<div id="chat-messages" class="chat-messages"></div>

			<div
				id="typing-indicator"
				class="typing-indicator"
			>
				AI is thinking...
			</div>

			<div class="input-area">
				<div class="input-box">
					<textarea
						id="user-input"
						rows="1"
						placeholder="Message your AI..."
						autofocus
					></textarea>

					<button id="send-button">
						Send
					</button>
				</div>
			</div>

		</main>
	</div>

	<script src="/chat.js"></script>
</body>
</html>
